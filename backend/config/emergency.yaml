# =============================================================================
# ACİL BELİRTİ TESPİTİ — KURAL TABANLI, LLM'DEN BAĞIMSIZ
# =============================================================================
# Sohbet mesajları ve check-in notları bu listeyle taranır. Eşleşme olursa
# LLM'e gitmeden ÖNCE `emergency` olayı üretilir; LLM kapalıyken de çalışır.
#
# Eşleştirme: büyük/küçük harf ve Türkçe karakter duyarsız alt-dize araması
# ("gogus agrisi" = "Göğüs ağrısı"). Eski ekranlarda olumsuzlamaları ("ağrım yok") ayırt etmez
# (bilinçli olarak fazla tetikler). Yeni "Asistana sor" sohbeti basit olumsuzlamayı ayırt eder
# ("göğüs ağrım yok", "no chest pain" tetiklemez). Sonuç: gemide CMO kaydı; Dünya'ya gönderilmez.
#
# ⚠ PROTOKOL METNİ PLACEHOLDER'DIR.
# TODO: Mürettebat tıbbi acil durum prosedürleri ve uçuş cerrahı ile doğrula.
# =============================================================================

protocol:
  id: EMERGENCY-PLACEHOLDER-01
  verified: false
  title:
    tr: "Olası acil durum — tıbbi acil protokolü başlatın"
    en: "Possible emergency — start the medical emergency protocol"
  steps:
    tr:
      - "Mürettebat sağlık sorumlusunu (CMO) hemen çağırın; kişiyi yalnız bırakmayın."
      - "Gemideki tıbbi acil durum kontrol listesini açın ve adımları uygulayın."
      - "Gerekirse Dünya ile iletişime geçme kararını CMO verir."
      - "Belirtileri ve zamanlarını kaydedin."
    en:
      - "Call the crew medical officer (CMO) immediately; do not leave the person alone."
      - "Open the onboard medical emergency checklist and follow its steps."
      - "If needed, the CMO decides whether to contact Earth."
      - "Record the symptoms and their timing."
  contacts:
    - "Mürettebat sağlık sorumlusu (CMO)"
    - "Yer ekibi: uçuş cerrahı (CMO'nun kararıyla)"

symptoms:
  chest_pain:
    label: {tr: Göğüs ağrısı, en: Chest pain}
    terms:
      - göğüs ağrısı
      - göğsüm ağrıyor
      - göğsümde ağrı
      - göğsüm sıkışıyor
      - göğsümde baskı
      - chest pain
      - chest tightness
      - chest pressure
  altered_consciousness:
    label: {tr: Bilinç değişikliği, en: Altered consciousness}
    terms:
      - bilinç kaybı
      - bilincini kaybetti
      - bayıldım
      - bayıldı
      - bayılacak gibi
      - kendimden geçtim
      - nerede olduğumu bilmiyorum
      - passed out
      - fainted
      - lost consciousness
      - unconscious
      - confused and disoriented
  breathing:
    label: {tr: Solunum güçlüğü, en: Breathing difficulty}
    terms:
      - nefes alamıyorum
      - nefes darlığı
      - nefesim daralıyor
      - boğuluyorum
      - can't breathe
      - cannot breathe
      - shortness of breath
      - short of breath
  stroke_signs:
    label: {tr: İnme belirtileri, en: Stroke signs}
    terms:
      - yüzüm kaydı
      - konuşamıyorum
      - kolumu hissetmiyorum
      - bir tarafım uyuşuk
      - face drooping
      - slurred speech
      - arm weakness
  severe_bleeding:
    label: {tr: Ciddi kanama, en: Severe bleeding}
    terms:
      - kanama durmuyor
      - çok kan kaybediyorum
      - bleeding won't stop
      - heavy bleeding
  self_harm:
    label: {tr: Kendine zarar verme riski, en: Self-harm risk}
    terms:
      - kendimi öldürmek
      - intihar
      - yaşamak istemiyorum
      - kendime zarar
      - kill myself
      - suicide
      - suicidal
      - hurt myself
      - want to die
