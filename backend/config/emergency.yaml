# =============================================================================
# ACİL BELİRTİ TESPİTİ — KURAL TABANLI, LLM'DEN BAĞIMSIZ
# =============================================================================
# Sohbet mesajları ve check-in notları bu listeyle taranır. Eşleşme olursa
# LLM'e gitmeden ÖNCE `emergency` olayı üretilir; LLM kapalıyken de çalışır.
#
# Eşleştirme: büyük/küçük harf ve aksan duyarsız alt-dize araması
# ("CHEST PAIN" = "chest pain"). Olumsuzlamaları ("no chest pain") ayırt etmez:
# güvenlik için bilinçli olarak fazla tetiklemeyi tercih eder.
# Kullanıcıya görünen metinler İngilizcedir (proje dili). Apostrof yazılmayan
# varyantlar ("cant breathe") ayrıca listelenir.
#
# ⚠ PROTOKOL METNİ PLACEHOLDER'DIR.
# TODO: Mürettebat tıbbi acil durum prosedürleri ve uçuş cerrahı ile doğrula.
# =============================================================================

protocol:
  id: EMERGENCY-PLACEHOLDER-01
  verified: false
  title: "Possible emergency — start the medical emergency protocol"
  steps:
    - "Call the crew medical officer (CMO) immediately; do not leave the person alone."
    - "Open the onboard medical emergency checklist and follow its steps."
    - "Send an emergency notice to the ground team (flight surgeon); account for the communication delay."
    - "Record the symptoms and their timing."
  contacts:
    - "Crew medical officer (CMO)"
    - "Ground team: flight surgeon"

symptoms:
  chest_pain:
    label: Chest pain
    terms:
      - chest pain
      - chest hurts
      - pain in my chest
      - chest tightness
      - tight chest
      - chest pressure
      - pressure in my chest
  altered_consciousness:
    label: Altered consciousness
    terms:
      - passed out
      - fainted
      - fainting
      - about to faint
      - blacked out
      - lost consciousness
      - unconscious
      - confused and disoriented
      - don't know where i am
      - dont know where i am
  breathing:
    label: Breathing difficulty
    terms:
      - can't breathe
      - cant breathe
      - cannot breathe
      - difficulty breathing
      - trouble breathing
      - shortness of breath
      - short of breath
      - choking
  stroke_signs:
    label: Stroke signs
    terms:
      - face drooping
      - slurred speech
      - can't speak
      - cant speak
      - arm weakness
      - numb on one side
      - one side is numb
  severe_bleeding:
    label: Severe bleeding
    terms:
      - bleeding won't stop
      - bleeding wont stop
      - heavy bleeding
      - losing a lot of blood
      - coughing up blood
  self_harm:
    label: Self-harm risk
    terms:
      - kill myself
      - suicide
      - suicidal
      - hurt myself
      - harm myself
      - self-harm
      - want to die
      - end my life
