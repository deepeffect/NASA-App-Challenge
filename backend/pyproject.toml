[project]
name = "astro-health-backend"
version = "0.1.0"
description = "Offline astronaut health monitoring backend (NASA Space Apps 2026 - AI Gambit)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "sqlmodel>=0.0.22",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "openai>=1.40",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  # Gelecek hafta tahmin modeli (ai-gambit-ml/models/*.joblib). Model dosyası bu sürümlerle üretildi;
  # sürüm değişirse joblib dosyası yüklenmeyebilir → sabit tutun (ayrıntı: ai-gambit-ml/README.md).
  "scikit-learn==1.9.1",
  "joblib==1.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Ağır bağımlılıklar ayrı: arayüz ekibi bunları kurmadan mock modda çalışabilir.
rag = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "pypdf>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
